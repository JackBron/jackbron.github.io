name = "christmas"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Origins allowed to call the API. Add your own domain if the page moves.
[vars]
ALLOWED_ORIGINS = "https://jackbron.github.io,http://localhost:4173"
SITE_URL = "https://jackbron.github.io/christmas/"
# "resend" or "brevo" — leave empty to send texts only. The API key is a secret.
EMAIL_PROVIDER = "brevo"
# Resend: an address on a domain you've verified there. Brevo: a verified sender.
EMAIL_FROM = "ryanclarkw@gmail.com"
# Twilio phone number (+15551234567) or Messaging Service SID (MG...).
TWILIO_FROM = "+17372583742"

# Secrets (npx wrangler secret put NAME), never committed:
#   ADMIN_PASSWORD      required — the admin page login
#   EMAIL_API_KEY       Resend or Brevo API key
#   TWILIO_ACCOUNT_SID  for texts
#   TWILIO_AUTH_TOKEN   for texts

[[durable_objects.bindings]]
name = "PARTY"
class_name = "Party"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Party"]
