name = "christmas"
main = "src/index.js"
compatibility_date = "2026-06-01"

# Origins allowed to call the API. Add your own domain if the page moves.
[vars]
ALLOWED_ORIGINS = "https://jackbron.github.io,http://localhost:4173"

# Secrets (npx wrangler secret put NAME), never committed:
#   ADMIN_PASSWORD      required: the admin login, and the key that signs guest sign-ins

[[durable_objects.bindings]]
name = "PARTY"
class_name = "Party"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Party"]
