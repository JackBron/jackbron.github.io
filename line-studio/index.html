<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Line Studio — Cooking Mode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LINE STUDIO — cooking mode
   Palette: commercial-kitchen enamel + steel, hazard amber timers
   ============================================================ */
:root{
  --bg:#E6E9E4; --panel:#FBFCFA; --panel2:#F1F3EF;
  --ink:#121716; --ink2:#5C6664; --ink3:#8A9491;
  --line:#C7CDC6; --line2:#DDE2DA;
  --hob:#0F5F4E; --hob-ink:#FFFFFF;
  --flame:#E39B0B; --alarm:#BE2E1B;
  --chit:#FFFDF4;
  --shadow:0 1px 0 rgba(18,23,22,.06), 0 8px 24px -18px rgba(18,23,22,.5);
  --rail:#0F5F4E;
  --f-disp:'Oswald','Haettenschweiler','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --bar:30px;
}
[data-theme="night"]{
  --bg:#0E1211; --panel:#181D1C; --panel2:#202625; --ink:#E9EFEC; --ink2:#9AA6A2; --ink3:#6E7A76;
  --line:#2C3432; --line2:#232A29; --hob:#39C09B; --hob-ink:#06211B;
  --flame:#FFC24D; --alarm:#FF6A52; --chit:#1D2322; --rail:#39C09B;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 30px -20px #000;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-bottom:var(--bar);
}
h1,h2,h3,.disp{font-family:var(--f-disp);font-weight:500;letter-spacing:.01em;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}

/* ---------- top rail ---------- */
.rail{
  position:sticky;top:0;z-index:60;background:var(--rail);color:var(--hob-ink);
  display:flex;align-items:center;gap:14px;padding:0 14px;height:52px;
}
[data-theme="night"] .rail{color:#06211B}
.brand{font-family:var(--f-disp);font-size:21px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;opacity:.7;display:block;margin-top:-4px}
.rail .spacer{flex:1}
.rbtn{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:inherit;border:1px solid rgba(255,255,255,.35);border-radius:2px;padding:7px 10px;white-space:nowrap;
}
[data-theme="night"] .rbtn{border-color:rgba(6,33,27,.35)}
.rbtn:hover{background:rgba(255,255,255,.14)}
[data-theme="night"] .rbtn:hover{background:rgba(6,33,27,.14)}
.rbtn.on{background:var(--flame);color:#1a1200;border-color:transparent}

/* ---------- shell ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 40px}
.hidden{display:none !important}

/* ---------- library ---------- */
.libhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:18px}
.libhead h1{font-size:34px;text-transform:uppercase;letter-spacing:.06em;line-height:1}
.search{
  flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:2px;
  padding:9px 11px;font-family:var(--f-mono);font-size:13px;
}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
.chit{
  background:var(--chit);border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow);
  text-align:left;padding:0 0 12px;display:flex;flex-direction:column;min-height:150px;position:relative;overflow:hidden;
}
.chit:hover{border-color:var(--hob);transform:translateY(-1px)}
.chit .punch{
  height:22px;border-bottom:1px dashed var(--line);display:flex;align-items:center;gap:8px;padding:0 10px;
  background:repeating-linear-gradient(90deg,transparent 0 9px,var(--line2) 9px 10px);
}
.chit .punch span{background:var(--chit);padding:0 6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.chit h3{font-size:21px;line-height:1.12;padding:11px 12px 4px;text-transform:uppercase;letter-spacing:.02em}
.chit p{margin:0;padding:0 12px;font-size:13px;color:var(--ink2);flex:1;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chit .meta{display:flex;gap:10px;padding:10px 12px 0;font-family:var(--f-mono);font-size:11px;color:var(--ink3);letter-spacing:.06em}
.chit .del{position:absolute;top:26px;right:6px;font-family:var(--f-mono);font-size:11px;color:var(--ink3);padding:4px 6px;opacity:0}
.chit:hover .del{opacity:1}
.chit .del:hover{color:var(--alarm)}

.empty{
  border:1px dashed var(--line);border-radius:3px;padding:44px 22px;text-align:center;background:var(--panel);
}
.empty h2{font-size:24px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.empty p{color:var(--ink2);max-width:52ch;margin:0 auto 18px;font-size:14px}
.btnrow{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
.btn{
  font-family:var(--f-mono);font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--line);background:var(--panel);border-radius:2px;padding:10px 14px;color:var(--ink);
}
.btn:hover{border-color:var(--hob);color:var(--hob)}
.btn.solid{background:var(--hob);color:var(--hob-ink);border-color:var(--hob)}
.btn.solid:hover{filter:brightness(1.08);color:var(--hob-ink)}
.btn.big{font-size:14px;padding:15px 22px;letter-spacing:.12em}

/* ---------- recipe view ---------- */
.rhead{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:20px}
.rhead h1{font-size:clamp(30px,6vw,52px);line-height:1;text-transform:uppercase;letter-spacing:.01em;margin:6px 0 8px}
.rhead p.desc{margin:0;max-width:66ch;color:var(--ink2)}
.specs{display:flex;flex-wrap:wrap;gap:0;margin-top:16px;border:1px solid var(--line);border-radius:2px;background:var(--panel);overflow:hidden}
.spec{padding:8px 14px;border-right:1px solid var(--line);min-width:96px}
.spec:last-child{border-right:none}
.spec b{display:block;font-family:var(--f-mono);font-size:16px;font-weight:500}
.scalewarn{margin-top:12px;border:1px solid var(--flame);border-left-width:3px;border-radius:2px;
  background:var(--panel);padding:9px 12px;font-size:13.5px;color:var(--ink)}
.scalewarn b{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--flame);display:block;margin-bottom:3px;font-weight:500}
.macros{margin-top:12px;border:1px solid var(--line);border-radius:2px;background:var(--panel);overflow:hidden}
.macros .mcap{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
  padding:6px 12px 0}
.macros .mrow{display:flex;flex-wrap:wrap}
.macros .mcell{padding:2px 14px 9px;min-width:84px}
.macros .mcell b{font-family:var(--f-mono);font-size:21px;font-weight:500;display:block;line-height:1.1}
.macros .mcell.kcal b{color:var(--flame)}
.macros .mcell span{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.macros .mtot{border-top:1px dotted var(--line);padding:6px 12px;font-family:var(--f-mono);font-size:11px;color:var(--ink2)}
.macros .est{color:var(--flame)}
.daytot{border-top:1px dotted var(--line2);margin:0 7px;padding:6px 0 7px;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;color:var(--ink2)}
.daytot b{color:var(--flame);font-weight:500}
.wktot{font-family:var(--f-mono);font-size:11px;color:var(--ink2);letter-spacing:.04em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);border-radius:2px;padding:3px 7px;color:var(--ink2)}

.cols{display:grid;grid-template-columns:minmax(280px,1fr) 1.6fr;gap:34px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr;gap:26px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:14px 14px 16px}
.panel h2{font-size:15px;text-transform:uppercase;letter-spacing:.16em;color:var(--ink2);
  border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;font-family:var(--f-mono);font-weight:500}

/* servings stepper */
.serv{display:flex;align-items:center;gap:0;margin-bottom:14px;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.serv button{width:42px;height:40px;font-family:var(--f-mono);font-size:18px;background:var(--panel2);color:var(--ink)}
.serv button:hover{background:var(--hob);color:var(--hob-ink)}
.serv .val{flex:1;text-align:center;font-family:var(--f-mono);font-size:15px}
.serv .val small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.scaled{color:var(--flame)}

/* ingredient BOM */
.igroup{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--hob);margin:14px 0 6px}
.igroup:first-child{margin-top:0}
ul.bom{list-style:none;margin:0;padding:0}
ul.bom li{display:grid;grid-template-columns:14px 76px 1fr;gap:9px;align-items:baseline;
  padding:6px 0;border-bottom:1px dotted var(--line2);cursor:pointer;font-size:14px}
ul.bom li:hover{background:var(--panel2)}
ul.bom li .box{width:12px;height:12px;border:1.5px solid var(--ink3);border-radius:2px;position:relative;top:2px}
ul.bom li.got .box{background:var(--hob);border-color:var(--hob)}
ul.bom li.got .box::after{content:"";position:absolute;left:3px;top:0px;width:4px;height:8px;border:solid var(--hob-ink);border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
ul.bom li .qty{font-family:var(--f-mono);font-size:13px;text-align:right;white-space:nowrap}
ul.bom li.got .nm,ul.bom li.got .qty{color:var(--ink3);text-decoration:line-through}
ul.bom li .nm small{display:block;font-size:12px;color:var(--ink3);text-decoration:none}
.compbtn{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--flame);color:var(--flame);border-radius:2px;padding:1px 5px;margin-left:6px;white-space:nowrap}
.compbtn:hover{background:var(--flame);color:#1a1200}
ul.comp{list-style:none;margin:7px 0 3px;padding:5px 0 3px 9px;border-left:2px solid var(--flame)}
ul.comp li{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:2px 0;border:none;font-size:12.5px;cursor:default}
ul.comp li:hover{background:none}
ul.comp li .q{font-family:var(--f-mono);text-align:right;color:var(--ink2)}
ul.comp .cap{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  grid-column:1/3;margin-bottom:3px}

/* step list */
.steplist{list-style:none;margin:0;padding:0;counter-reset:s}
.steplist li{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line2)}
.steplist li .n{font-family:var(--f-disp);font-size:26px;color:var(--ink3);line-height:1;padding-top:2px}
.steplist li h4{margin:0 0 3px;font-family:var(--f-disp);font-size:19px;text-transform:uppercase;letter-spacing:.03em;font-weight:500}
.steplist li p{margin:0;color:var(--ink2);font-size:15px}
.sgroup{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--hob);margin:18px 0 2px;padding-top:8px}
.steplist li.past .n{color:var(--hob)}
.steplist li.past h4,.steplist li.past p{color:var(--ink3)}
.steplist li.here{background:var(--panel2);border-left:3px solid var(--flame);
  margin-left:-14px;padding-left:11px;padding-right:8px;border-radius:2px}
.steplist li.here .n{color:var(--flame)}
.mark{display:inline-block;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:#1a1200;background:var(--flame);border-radius:2px;padding:2px 6px;margin-bottom:6px}
@media(max-width:520px){.ticket .tname{font-size:13px}.ticket .tpos{display:none}}
.tbadge{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;
  border:1px solid var(--flame);color:var(--flame);border-radius:2px;padding:2px 6px;margin-top:7px}
.ref{font-family:var(--f-mono);font-size:.92em;background:var(--panel2);border-bottom:1.5px solid var(--flame);padding:0 3px;border-radius:2px 2px 0 0;white-space:nowrap}
[data-theme="night"] .ref{background:#2a3130}

.notes{margin-top:22px;border-left:3px solid var(--flame);padding:2px 0 2px 14px;color:var(--ink2);font-size:14px;white-space:pre-wrap}
.startbar{position:sticky;bottom:calc(var(--bar) + 10px);margin-top:26px;display:flex;flex-wrap:wrap;gap:10px;z-index:20}
.startbar .btn.big{flex:1;box-shadow:var(--shadow)}

/* ---------- cooking mode ---------- */
#cook{position:fixed;inset:0 0 var(--bar) 0;background:var(--bg);z-index:70;display:flex;flex-direction:column}
.ticket{background:var(--rail);color:var(--hob-ink);padding:9px 14px;display:flex;align-items:center;gap:12px}
[data-theme="night"] .ticket{color:#06211B}
.ticket .tname{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.1em;font-size:15px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.ticket .tpos{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em}
.prograil{display:flex;gap:3px;padding:0 14px;background:var(--rail)}
.prograil i{flex:1;height:5px;background:rgba(255,255,255,.25);border-radius:1px}
[data-theme="night"] .prograil i{background:rgba(6,33,27,.3)}
.prograil i.done{background:var(--flame)}
.prograil i.now{background:#fff}
[data-theme="night"] .prograil i.now{background:#06211B}

.stepwrap{flex:1;overflow:auto;padding:26px 20px 20px;-webkit-overflow-scrolling:touch}
.stepin{max-width:900px;margin:0 auto}
.stepin .sg{margin-bottom:8px}
.stepin h2{font-size:clamp(28px,5.4vw,46px);line-height:1.03;text-transform:uppercase;letter-spacing:.01em;margin-bottom:16px}
.stepin .body{font-size:clamp(18px,2.6vw,25px);line-height:1.48;max-width:40ch;font-weight:400}
.stepin .snote{margin-top:18px;font-size:15px;color:var(--ink2);border-left:3px solid var(--line);padding-left:12px;white-space:pre-wrap}
.usedlist{margin-top:24px;border-top:1px solid var(--line);padding-top:12px}
.usedlist .eyebrow{margin-bottom:8px;display:block}
.usedchips{display:flex;flex-wrap:wrap;gap:7px}
.uchip{font-family:var(--f-mono);font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:2px;padding:5px 9px}
.uchip b{color:var(--flame);font-weight:500}

.cookbar{display:flex;gap:9px;padding:11px 14px calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
.cookbar button{flex:1;font-family:var(--f-mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:2px;padding:16px 8px;background:var(--bg);color:var(--ink)}
.cookbar button:hover{border-color:var(--hob)}
.cookbar button.next{background:var(--hob);color:var(--hob-ink);border-color:var(--hob);flex:1.7}
.cookbar button.fire{background:var(--flame);color:#1a1200;border-color:var(--flame);flex:1.4}
.cookbar button:disabled{opacity:.35;cursor:default}

/* timers */
#tray{position:fixed;right:12px;top:64px;z-index:80;display:flex;flex-direction:column;gap:8px;width:224px;
  max-width:calc(100vw - 24px);max-height:calc(100vh - 110px);overflow:auto}
body.cooking #tray{top:96px}
.trayhead{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:2px;padding:5px 6px 5px 9px;box-shadow:var(--shadow)}
.trayhead span{flex:1;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.trayhead button{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--hob);color:var(--hob);border-radius:2px;padding:3px 7px}
.trayhead button:hover{background:var(--hob);color:var(--hob-ink)}
.tnew{background:var(--panel);border:1px solid var(--hob);border-radius:2px;padding:9px;box-shadow:var(--shadow)}
.tnew input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:2px;
  padding:6px 7px;font-family:var(--f-mono);font-size:12px;margin-bottom:6px}
.tnew .row{display:flex;gap:6px}
.tnew .row button{flex:1;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:2px;padding:5px 4px;color:var(--ink2)}
.tnew .row button.go{background:var(--hob);color:var(--hob-ink);border-color:var(--hob)}
.tnew .hint{font-family:var(--f-mono);font-size:9.5px;color:var(--ink3);letter-spacing:.04em;margin:-2px 0 6px}
/* in cooking mode the tray drops out of the overlay and into the layout,
   so a long step never runs underneath it */
#tray.docked{position:static;width:auto;max-width:none;max-height:none;
  flex-direction:row;align-items:stretch;gap:8px;padding:9px 12px;
  background:var(--panel2);border-top:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;flex:0 0 auto}
#tray.docked .trayhead{flex:0 0 auto;box-shadow:none;align-self:center;padding:5px 6px 5px 9px}
#tray.docked .trayhead span{flex:0 0 auto}
#tray.docked .timer{flex:0 0 auto;min-width:150px}
#tray.docked .timer .cd{font-size:23px}
#tray.docked .tnew{flex:0 0 auto;width:206px}
/* floating tray (library + recipe views) reserves room rather than covering */
@media(max-width:1420px){ body.has-timers .wrap{padding-right:250px} }
@media(max-width:700px){
  body.has-timers .wrap{padding-right:16px}
  #tray:not(.docked){top:auto;bottom:calc(var(--bar) + 8px);left:8px;right:8px;width:auto;
    flex-direction:row;align-items:stretch;overflow-x:auto;max-height:none}
  #tray:not(.docked) .trayhead{flex:0 0 auto;align-self:center}
  #tray:not(.docked) .trayhead span{flex:0 0 auto}
  #tray:not(.docked) .timer{flex:0 0 auto;min-width:150px}
  #tray:not(.docked) .tnew{flex:0 0 auto;width:206px}
}
.timer .lbl{cursor:text}
.timer .lbl:hover{color:var(--hob);text-decoration:underline dotted}
.timer input.rn{width:100%;background:var(--panel2);border:1px solid var(--hob);border-radius:2px;
  padding:2px 5px;font-family:var(--f-mono);font-size:11px;margin-bottom:2px}
.timer{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--flame);border-radius:2px;
  padding:8px 10px;box-shadow:var(--shadow)}
.timer .lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.timer .cd{font-family:var(--f-mono);font-size:27px;line-height:1.05;font-variant-numeric:tabular-nums}
.timer .acts{display:flex;gap:6px;margin-top:5px}
.timer .acts button{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:2px;padding:3px 6px;color:var(--ink2)}
.timer .acts button:hover{border-color:var(--hob);color:var(--hob)}
.timer.ring{border-left-color:var(--alarm);animation:blink .7s steps(2) infinite}
.timer.ring .cd{color:var(--alarm)}
.timer.soon .cd{color:var(--flame)}
@keyframes blink{50%{background:var(--panel2)}}
@media(prefers-reduced-motion:reduce){.timer.ring{animation:none}}


/* ---------- planner ---------- */

<script>
"use strict";
/* =====================================================================
   LINE STUDIO r13 — standalone cooking mode
   Loads recipe JSON (single recipe, array, or cookbook) and runs it.
   Library, week plan, and theme persist in localStorage; the exported
   cookbook file carries all of it as the portable backup.
   r12: shopping list — per-mix break-down switches, mix provenance on every
   line, and a Combined / By-recipe view that the text export follows.
   r13: "shop": false keeps non-purchasable ingredients (reserved pasta water,
   water for boiling) out of the shopping list without hiding them from the cook.
   ===================================================================== */

const $ = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));

const S = {
  book: [],          // normalized recipes
  cur: null,         // current recipe
  servings: 4,
  got: new Set(),    // checked ingredient ids
  idx: 0,            // current step index
  timers: [],
  newTimer: false,
  plan: {},              // "2026-08-17" -> [{r:recipeId, s:servings, slot:"Dinner"}]
  week: null,            // Date of the Monday being shown
  shopGot: new Set(),
  comp: new Set(),       // ingredient ids whose breakdown is expanded
  mixShut: new Set(),    // shopping list: mixes set to "buy the packet" (absent = break down)
  wake: null,
  view: 'lib'
};

/* ---------------- utilities ---------------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function say(m){ const e=$('#smsg'); e.textContent=m||''; if(m){ clearTimeout(say._t); say._t=setTimeout(()=>{ if(e.textContent===m) e.textContent=''; },4200);} }
function uid(p){ return (p||'x')+Math.random().toString(36).slice(2,8); }

const METRIC = new Set(['g','kg','mg','ml','l','L']);
const UNIT_LABEL = {g:'g',kg:'kg',mg:'mg',ml:'ml',l:'L',tsp:'tsp',tbsp:'Tbsp',cup:'cup',fl_oz:'fl oz',
  oz:'oz',lb:'lb',pinch:'pinch',clove:'clove',slice:'slice',sprig:'sprig',can:'can',stick:'stick',qt:'qt',pt:'pt',gal:'gal',package:'package'};
const PLURAL = {cup:'cups',pinch:'pinches',clove:'cloves',slice:'slices',sprig:'sprigs',can:'cans',stick:'sticks',package:'packages'};
const FRACTS = [[.0625,'1/16'],[.125,'⅛'],[.1875,'3/16'],[.25,'¼'],[.333333,'⅓'],[.375,'⅜'],[.5,'½'],
  [.625,'⅝'],[.666667,'⅔'],[.75,'¾'],[.875,'⅞']];

function fmtNum(v, unit){
  if(v==null || isNaN(v)) return '';
  if(METRIC.has(unit)){
    if(unit==='kg'||unit==='l'||unit==='L') return String(Math.round(v*100)/100);
    let r = v>=100 ? Math.round(v/5)*5 : v>=10 ? Math.round(v) : Math.round(v*10)/10;
    return String(r);
  }
  const whole = Math.floor(v + 1e-9);
  const rem = v - whole;
  if(rem > .955) return String(whole+1);
  let best=null, bd=.03;
  for(const [f,g] of FRACTS){ const d=Math.abs(rem-f); if(d<bd){bd=d;best=g;} }
  if(rem < .045) return String(whole);
  if(best) return (whole? whole+' ':'') + best;
  return String(Math.round(v*100)/100);
}
function unitLabel(u,v){
  if(!u) return '';
  const base = UNIT_LABEL[u] || u;
  if(v>1 && PLURAL[u]) return PLURAL[u];
  return base;
}
function compLine(c, ing, mult){
  const m = (ing.scale===false) ? 1 : mult;
  const v = (c.amount==null ? 1 : c.amount) * m;
  return {
    q:  c.amount==null ? '' : qtyOf({...c, scale:ing.scale}, mult),
    nm: (c.namePlural && v>1) ? c.namePlural : c.name
  };
}
function nameOf(ing, mult){
  const m = (ing.scale===false) ? 1 : mult;
  const v = ing.amount==null ? 1 : ing.amount*m;
  return (ing.namePlural && v>1) ? ing.namePlural : ing.name;
}
/* keep scaled amounts in a unit a cook can actually measure:
   1/8 cup -> 2 Tbsp, 2/3 Tbsp -> 2 tsp, 1500 g -> 1.5 kg */
const nearMul=(v,m)=>Math.abs(v/m - Math.round(v/m)) < 1e-9;
function normUnit(v,u){
  for(let i=0;i<3;i++){
    if(u==='cup'  && v<0.25){ v*=16;   u='tbsp'; continue; }
    if(u==='tbsp' && v<1)   { v*=3;    u='tsp';  continue; }
    /* only step up when the bigger unit lands on something measurable:
       6 tsp -> 2 Tbsp, but 4 tsp stays 4 tsp rather than 1 1/3 Tbsp */
    if(u==='tsp'  && v>=3 && nearMul(v,0.75)) { v/=3;  u='tbsp'; continue; }
    if(u==='tbsp' && v>=8 && nearMul(v,4))    { v/=16; u='cup';  continue; }
    if(u==='lb'   && v<1)   { v*=16;   u='oz';   continue; }
    if(u==='l'    && v<1)   { v*=1000; u='ml';   continue; }
    if(u==='kg'   && v<1)   { v*=1000; u='g';    continue; }
    if(u==='g'    && v>=1000){ v/=1000; u='kg';  continue; }
    if(u==='ml'   && v>=1000){ v/=1000; u='l';   continue; }
    break;
  }
  return [v,u];
}
function qtyOf(ing, mult){
  const m = (ing.scale===false) ? 1 : mult;
  if(ing.amount==null) return ing.unit? unitLabel(ing.unit,1) : '';
  let [v,u] = normUnit(ing.amount * m, ing.unit);
  const n = fmtNum(v, u);
  const ul = unitLabel(u, v);
  return ul ? n+' '+ul : n;
}
function mmss(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  const p = n => String(n).padStart(2,'0');
  return h ? h+':'+p(m)+':'+p(s) : p(m)+':'+p(s);
}
/* "10" -> 10 min | "90s" | "1h30" | "2:30" | "1:05:00" */
function parseDur(txt){
  const t = String(txt||'').trim().toLowerCase();
  if(!t) return 0;
  if(/^\d{1,3}:\d{2}(:\d{2})?$/.test(t)){
    const p = t.split(':').map(Number);
    return p.length===3 ? p[0]*3600+p[1]*60+p[2] : p[0]*60+p[1];
  }
  const re = /(\d+(?:\.\d+)?)\s*(hours?|hrs?|h|minutes?|mins?|m|seconds?|secs?|s)?/g;
  let m, total=0, found=false;
  while((m = re.exec(t))){
    found = true;
    const v = parseFloat(m[1]), u = (m[2]||'m')[0];
    total += u==='h' ? v*3600 : u==='s' ? v : v*60;
  }
  return found ? Math.round(total) : 0;
}
function minsText(m){ if(!m) return ''; if(m<60) return m+' min'; const h=Math.floor(m/60), r=m%60; return r? h+' h '+r+' m' : h+' h'; }

/* ---------------- persistence ---------------- */
const LS_KEY = 'linestudio.v1';
function save(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      book: S.book, plan: S.plan,
      theme: document.documentElement.getAttribute('data-theme')||'day'
    }));
  }catch(e){ /* storage blocked — export is the fallback */ }
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(!d) return;
    if(Array.isArray(d.book)) S.book = d.book.map(normRecipe);
    if(d.plan && typeof d.plan==='object') S.plan = d.plan;
    if(d.theme==='night'){ document.documentElement.setAttribute('data-theme','night'); $('#btnTheme').textContent='Day'; }
  }catch(e){}
}

/* ---------------- dates ---------------- */
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function weekStart(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function weekLabel(mon){
  const sun = addDays(mon,6);
  const a = MONS[mon.getMonth()]+' '+mon.getDate();
  const b = (mon.getMonth()===sun.getMonth()? '' : MONS[sun.getMonth()]+' ') + sun.getDate();
  return a+' – '+b;
}

/* ---------------- normalization (tolerant importer) ---------------- */
function num(x){ if(typeof x==='number') return x; if(typeof x==='string'){ const m=x.match(/-?\d+(\.\d+)?/); if(m) return parseFloat(m[0]); } return null; }

function normRecipe(raw){
  if(!raw || typeof raw!=='object') throw new Error('not an object');
  const r = {};
  r.id = String(raw.id || uid('r'));
  r.title = String(raw.title || raw.name || 'Untitled recipe');
  r.description = raw.description || raw.summary || '';
  r.servings = num(raw.servings ?? raw.baseServings ?? raw.base_servings) || 4;
  r.servingsLabel = raw.servingsLabel || raw.servings_label || 'servings';
  r.yield = raw.yield || '';
  const t = raw.times || {};
  r.prep  = num(t.prep  ?? raw.prepMinutes  ?? raw.prep_minutes) || 0;
  r.cook  = num(t.cook  ?? raw.cookMinutes  ?? raw.cook_minutes) || 0;
  r.total = num(t.total ?? raw.totalMinutes ?? raw.total_minutes) || (r.prep + r.cook) || 0;
  r.difficulty = raw.difficulty || '';
  r.source = raw.source || '';
  r.tags = Array.isArray(raw.tags) ? raw.tags.map(String) : [];
  r.equipment = Array.isArray(raw.equipment) ? raw.equipment.map(String) : [];
  r.notes = raw.notes || '';
  r.scaleNote = raw.scaleNote || raw.scale_note || '';
  r.scaleLimit = num(raw.scaleLimit ?? raw.scale_limit);
  const n = raw.nutrition || raw.macros || null;
  r.nutrition = null;
  if(n && typeof n==='object'){
    const kcal = num(n.calories ?? n.kcal);
    if(kcal!=null) r.nutrition = {
      calories: kcal,
      fat:     num(n.fat) ?? 0,
      carbs:   num(n.carbs ?? n.carbohydrates ?? n.carbohydrate) ?? 0,
      protein: num(n.protein) ?? 0,
      basis:   n.basis || 'per serving',
      source:  (n.source === 'estimate' || n.estimated) ? 'estimate' : 'source',
      note:    n.note || ''
    };
  }

  const ings = raw.ingredients || [];
  if(!Array.isArray(ings)) throw new Error('"ingredients" must be an array');
  r.ingredients = ings.map((x,i)=>{
    if(typeof x === 'string') return {id:String(i+1).padStart(4,'0'), name:x, amount:null, unit:null, group:'', note:'', scale:false};
    return {
      id: String(x.id != null ? x.id : String(i+1).padStart(4,'0')),
      name: String(x.name || x.item || 'ingredient'),
      namePlural: x.namePlural || x.name_plural || '',
      amount: num(x.amount ?? x.qty ?? x.quantity),
      unit: x.unit || null,
      group: x.group || x.section || '',
      note: x.note || '',
      scale: x.scale !== false,
      shop: x.shop !== false,
      components: Array.isArray(x.components) ? x.components.map(c=>({
        name: String(c.name || 'component'),
        namePlural: c.namePlural || c.name_plural || '',
        amount: num(c.amount ?? c.qty),
        unit: c.unit || null,
        note: c.note || '',
        shop: c.shop !== false
      })) : []
    };
  });

  const steps = raw.steps || raw.instructions || [];
  if(!Array.isArray(steps)) throw new Error('"steps" must be an array');
  r.steps = steps.map((x,i)=>{
    if(typeof x === 'string') return {id:'s'+(i+1), title:'', content:x, timer:0, group:'', note:'', uses:[]};
    return {
      id: String(x.id || ('s'+(i+1))),
      title: x.title || '',
      content: String(x.content || x.text || x.instruction || ''),
      timer: num(x.timerSeconds ?? x.timer_seconds ?? x.timer) || 0,
      group: x.group || x.section || '',
      note: x.note || '',
      uses: Array.isArray(x.ingredients) ? x.ingredients.map(String) : []
    };
  });
  if(!r.steps.length) throw new Error('recipe has no steps');
  return r;
}

function ingestJSON(text, label){
  let data;
  try{ data = JSON.parse(text); }
  catch(e){ throw new Error((label?label+': ':'')+'invalid JSON — '+e.message); }
  let list = [], plan = null;
  if(Array.isArray(data)) list = data;
  else if(Array.isArray(data.recipes)){ list = data.recipes; if(data.plan && typeof data.plan==='object') plan = data.plan; }
  else list = [data];
  const out = [];
  list.forEach((raw,i)=>{
    try{ out.push(normRecipe(raw)); }
    catch(e){ throw new Error((label?label+': ':'')+'recipe #'+(i+1)+' — '+e.message); }
  });
  out.plan = plan;
  return out;
}

function addRecipes(list){
  let added=0, replaced=0;
  list.forEach(r=>{
    const i = S.book.findIndex(x=>x.id===r.id);
    if(i>=0){ S.book[i]=r; replaced++; } else { S.book.push(r); added++; }
  });
  if(list.plan){ Object.assign(S.plan, list.plan); say('plan merged from file'); }
  save();
  renderLib();
  updateStatus();
  say(`loaded ${added} recipe${added===1?'':'s'}${replaced?`, replaced ${replaced}`:''}`);
}

/* ---------------- ingredient token rendering ---------------- */
/* {0001} -> "400 g spaghetti"   {0001|qty} -> "400 g"   {0001|name} -> "spaghetti" */
function renderContent(text, recipe, mult){
  const map = {}; recipe.ingredients.forEach(i=>map[i.id]=i);
  return esc(text).replace(/\{([A-Za-z0-9_.\-]+)(?:\|(qty|name|full))?\}/g, (m,id,mode)=>{
    const ing = map[id];
    if(!ing) return m;
    const q = qtyOf(ing, mult);
    let out;
    if(mode==='qty') out = q || nameOf(ing,mult);
    else if(mode==='name') out = ing.name;
    else out = (q? q+' ' : '') + nameOf(ing,mult);
    return '<span class="ref">'+esc(out)+'</span>';
  });
}

function openRecipe(id){
  const r = S.book.find(x=>x.id===id); if(!r) return;

function renderRec(){
  const r = S.cur, mult = S.servings / r.servings, scaled = Math.abs(mult-1)>0.001;
  const specs = [
    r.prep? ['Prep', minsText(r.prep)]:null,
    r.cook? ['Cook', minsText(r.cook)]:null,
    r.total? ['Total', minsText(r.total)]:null,

  // ingredients grouped

  r.ingredients.forEach(i=>{
    if(i.group !== lastG){
      lastG = i.group;

      if(i.group) ihtml += `<div class="igroup">${esc(i.group)}</div>`;
      ihtml += `<ul class="bom">`; open=true;

    ihtml += `<li data-ing="${esc(i.id)}" class="${S.got.has(i.id)?'got':''}">

      <span class="nm">${esc(nameOf(i,mult))}${i.components.length?`<button class="compbtn" data-comp="${esc(i.id)}">${S.comp.has(i.id)?'hide mix':'mix ▾'}</button>`:''}${i.note?`<small>${esc(i.note)}</small>`:''}${
        i.components.length && S.comp.has(i.id) ? `<ul class="comp">
          <li><span class="cap">Make it yourself — approximate</span></li>
          ${i.components.map(c=>{ const d=compLine(c,i,mult);
            return `<li><span class="q">${esc(d.q)}</span><span>${esc(d.nm)}${c.note?` <em style="color:var(--ink3)">— ${esc(c.note)}</em>`:''}</span></li>`; }).join('')}
        </ul>` : ''}</span></li>`;
  });
  if(open) ihtml += `</ul>`;

  // steps
  let shtml='', lastSG=null;
  r.steps.forEach((s,n)=>{
    if(s.group && s.group!==lastSG){ lastSG=s.group; shtml += `</ul><div class="sgroup">${esc(s.group)}</div><ul class="steplist">`; }
    const cls = (r.at!=null && n<r.at) ? 'past' : (r.at===n ? 'here' : '');
    shtml += `<li data-step="${n}" class="${cls}"><span class="n mono">${cls==='past'?'✓':String(n+1).padStart(2,'0')}</span><div>
      ${cls==='here'?`<span class="mark">Left off here</span><br>`:''}
      ${s.title?`<h4>${esc(s.title)}</h4>`:''}

    </div></li>`;
  });

  $('#viewRec').innerHTML = `
    <div class="rhead">
      <span class="eyebrow">${esc(r.source || (r.tags.join(' · ') || 'recipe'))}</span>
      <h1>${esc(r.title)}</h1>
      ${r.description?`<p class="desc">${esc(r.description)}</p>`:''}
      <div class="specs">${specs.map(([k,v])=>`<div class="spec"><span class="eyebrow">${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>
      ${r.scaleNote && S.servings > (r.scaleLimit || r.servings)
        ? `<div class="scalewarn"><b>Scaling caveat at ${S.servings} ${esc(r.servingsLabel)}</b>${esc(r.scaleNote)}</div>` : ''}
      ${r.nutrition ? macroStrip(r, S.servings) : ''}
      ${r.tags.length?`<div class="tags">${r.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}
    </div>
    <div class="cols">
      <aside>
        <div class="panel">
          <h2>Mise en place</h2>
          <div class="serv">
            <button data-serv="-1" aria-label="fewer servings">−</button>
            <span class="val"><b class="mono ${scaled?'scaled':''}">${S.servings}</b><small>${esc(r.servingsLabel)}</small></span>
            <button data-serv="1" aria-label="more servings">+</button>
          </div>
          ${ihtml}
        </div>
        ${r.equipment.length?`<div class="panel" style="margin-top:14px"><h2>Equipment</h2>
          <ul class="bom">${r.equipment.map(e=>`<li style="grid-template-columns:14px 1fr;cursor:default"><span class="box" style="visibility:hidden"></span><span class="nm">${esc(e)}</span></li>`).join('')}</ul></div>`:''}
      </aside>
      <section>
        <div class="panel">
          <h2>Method — ${r.steps.length} steps</h2>
          ${shtml}
          ${r.notes?`<div class="notes">${esc(r.notes)}</div>`:''}
        </div>
        <div class="startbar">
          ${r.at ? `<button class="btn big solid" data-act="cook">Resume — step ${r.at+1} of ${r.steps.length}</button>
                    <button class="btn big" data-act="restart">Start over</button>`

          <button class="btn big" data-act="print">Print</button>
        </div>
      </section>
    </div>`;
  updateStatus();
}

function macroStrip(r, servings){
  const n = r.nutrition, tot = servings || r.servings;
  const cell = (v,u,cls)=>`<div class="mcell ${cls||''}"><b>${Math.round(v)}</b><span>${u}</span></div>`;
  return `<div class="macros">
    <div class="mcap">${esc(n.basis)} · <span class="${n.source==='estimate'?'est':''}">${n.source==='estimate'?'estimated':'from source'}</span>${n.note?' · '+esc(n.note):''}</div>
    <div class="mrow">
      ${cell(n.calories,'kcal','kcal')}${cell(n.fat,'g fat')}${cell(n.carbs,'g carbs')}${cell(n.protein,'g protein')}

    <div class="mtot">Batch of ${tot} → ${Math.round(n.calories*tot)} kcal · ${Math.round(n.fat*tot)} g fat · ${Math.round(n.carbs*tot)} g carbs · ${Math.round(n.protein*tot)} g protein</div>
  </div>`;
}

function dockTray(on){
  const tray = $('#tray');

}
function goStep(d){
  const r=S.cur, n=S.idx+d;

  S.idx=n; renderCook();
  $('.stepwrap') && ($('.stepwrap').scrollTop=0);
}
function finishCook(){
  S.cur.at = null; save();

}
function quitCook(){
  dockTray(false);
  document.body.classList.remove('cooking');

/* ---------------- timers ---------------- */
let audioCtx=null;
function beep(times){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    for(let i=0;i<(times||3);i++){
      const t0 = audioCtx.currentTime + i*0.42;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type='square'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.22,t0+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.3);
      o.connect(g); g.connect(audioCtx.destination); o.start(t0); o.stop(t0+0.32);
    }
  }catch(e){}
}
function addTimer(label, seconds){
  if(!seconds || seconds<1){ say('that duration did not parse — try 10m, 90s, 1h30 or 2:30'); return; }
  let name = (label||'Timer').trim();
  const dupes = S.timers.filter(t=>t.label===name || t.label.startsWith(name+' ('));
  if(dupes.length) name = name+' ('+(dupes.length+1)+')';
  S.timers.push({id:uid('t'), label:name, total:seconds, left:seconds, running:true, since:0});
  S.newTimer = false;
  drawTimers(); say('timer started — '+name+' '+mmss(seconds));
  beep(1);
}
function actsFor(t){
  if(t.left<=0) return `<button data-tact="toggle">Restart</button><button data-tact="add">+1m</button><button data-tact="kill">Dismiss</button>`;
  return `<button data-tact="toggle">${t.running?'Pause':'Start'}</button><button data-tact="add">+1m</button><button data-tact="kill">Clear</button>`;
}
function drawTimers(){
  const tray = $('#tray');
  const showHead = S.view!=='lib' || S.timers.length || S.newTimer;
  tray.innerHTML =
    (showHead ? `<div class="trayhead"><span>Timers${S.timers.length?' · '+S.timers.length:''}</span>
       <button data-act="tnew">${S.newTimer?'Close':'＋ Add'}</button></div>` : '') +
    (S.newTimer ? `<div class="tnew">
       <input id="tnName" placeholder="What is it for?" maxlength="40">
       <input id="tnDur" placeholder="10m">
       <div class="hint">10 · 90s · 1h30 · 2:30</div>
       <div class="row"><button class="go" data-act="tstart">Start</button><button data-act="tcancel">Cancel</button></div>
     </div>` : '') +
    S.timers.map(t=>{
      const cls = t.left<=0 ? 'ring' : (t.left<=30 ? 'soon':'');
      return `<div class="timer ${cls}" data-t="${t.id}">
        <div class="lbl" data-tact="rename" title="Click to rename">${esc(t.label)}</div>
        <div class="cd">${t.left<=0?'DONE':mmss(t.left)}</div>
        <div class="acts">${actsFor(t)}</div></div>`;
    }).join('');
  if(S.newTimer){ const n=$('#tnName'); if(n) n.focus(); }
  $('#sdot').classList.toggle('live', S.timers.some(t=>t.running&&t.left>0));
  document.body.classList.toggle('has-timers', !!(S.timers.length || S.newTimer));
}
/* tick updates text in place so an open rename or composer field is never wiped */
setInterval(()=>{
  if(!S.timers.length) return;
  S.timers.forEach(t=>{
    if(t.running && t.left>0){
      t.left -= 1;
      if(t.left<=0){ t.running=false; t.since=0; beep(4); say('TIMER DONE — '+t.label); flashTitle(t.label); }
    } else if(t.left<=0){
      t.since = (t.since||0)+1;
      if(t.since%12===0 && t.since<=60) beep(3);   // nag every 12 s for a minute
    }
    const el = document.querySelector('.timer[data-t="'+t.id+'"]');
    if(!el) return;
    const cd = el.querySelector('.cd');
    if(cd) cd.textContent = t.left<=0 ? 'DONE' : mmss(t.left);
    el.classList.toggle('ring', t.left<=0);
    el.classList.toggle('soon', t.left>0 && t.left<=30);
    const tg = el.querySelector('[data-tact="toggle"]');
    if(tg) tg.textContent = t.left<=0 ? 'Restart' : (t.running?'Pause':'Start');
    const kl = el.querySelector('[data-tact="kill"]');
    if(kl) kl.textContent = t.left<=0 ? 'Dismiss' : 'Clear';
  });
},1000);
function startRename(box, t){
  const lbl = box.querySelector('.lbl');
  const inp = document.createElement('input');
  inp.className='rn'; inp.value=t.label; inp.maxLength=40;
  lbl.replaceWith(inp); inp.focus(); inp.select();
  const done = commit=>{
    if(commit && inp.value.trim()) t.label = inp.value.trim();
    drawTimers();
  };
  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); done(true); }
    if(e.key==='Escape'){ e.preventDefault(); done(false); }
  });
  inp.addEventListener('blur', ()=>done(true));
}
let flashInt=null;
function flashTitle(l){
  clearInterval(flashInt); let on=false; let n=0;
  flashInt = setInterval(()=>{ document.title = (on=!on) ? '⏰ '+l : 'Line Studio — Cooking Mode';
    if(++n>24){ clearInterval(flashInt); document.title='Line Studio — Cooking Mode'; } },600);
}

/* ---------------- wake lock ---------------- */
async function requestWake(on){
  const btn=$('#btnWake');
  if(!('wakeLock' in navigator)){ btn.textContent='Screen lock n/a'; return; }
  try{
    if(on){ S.wake = await navigator.wakeLock.request('screen');
      S.wake.addEventListener('release',()=>{ btn.classList.remove('on'); });
      btn.classList.add('on'); btn.textContent='Screen on';
    } else if(S.wake){ await S.wake.release(); S.wake=null; btn.classList.remove('on'); btn.textContent='Screen lock'; }
  }catch(e){ say('screen lock refused by browser'); }
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && $('#btnWake').classList.contains('on')) requestWake(true); });

/* ---------------- planner ---------------- */
function openPlan(){ if(!S.week) S.week = weekStart(new Date()); show('plan'); renderPlan(); }
function renderPlan(){
  const mon = S.week, today = ymd(new Date());
  const days = Array.from({length:7},(_,i)=>addDays(mon,i));
  const count = days.reduce((n,d)=>n+((S.plan[ymd(d)]||[]).length),0);
  const dayMacros = key => {
    const t = {calories:0, fat:0, carbs:0, protein:0, any:false};
    (S.plan[key]||[]).forEach(m=>{
      const r = S.book.find(x=>x.id===m.r);
      if(!r || !r.nutrition) return;
      t.any = true;
      t.calories += r.nutrition.calories * m.s;
      t.fat     += r.nutrition.fat     * m.s;
      t.carbs   += r.nutrition.carbs   * m.s;
      t.protein += r.nutrition.protein * m.s;
    });
    return t;
  };
  const week = days.map(d=>dayMacros(ymd(d)));
  const wk = week.reduce((a,t)=>({calories:a.calories+t.calories, fat:a.fat+t.fat,
    carbs:a.carbs+t.carbs, protein:a.protein+t.protein, any:a.any||t.any}),
    {calories:0,fat:0,carbs:0,protein:0,any:false});
  const macroLine = t => `<div class="daytot"><b>${Math.round(t.calories)} kcal</b> · ${Math.round(t.fat)}F ${Math.round(t.carbs)}C ${Math.round(t.protein)}P</div>`;
  $('#viewPlan').innerHTML = `
    <div class="planhead">
      <h1>Week planner</h1>
      <span class="wk mono">${weekLabel(mon)}</span>
      ${wk.any?`<span class="wktot">week: ${Math.round(wk.calories)} kcal · ${Math.round(wk.fat)}F ${Math.round(wk.carbs)}C ${Math.round(wk.protein)}P</span>`:''}
      <button class="btn" data-act="wkprev">←</button>
      <button class="btn" data-act="wktoday">Today</button>
      <button class="btn" data-act="wknext">→</button>
      <button class="btn solid" data-act="shop" ${count?'':'disabled'}>Shopping list</button>
    </div>
    <div class="week">${days.map((d,di)=>{
      const key = ymd(d), meals = S.plan[key]||[];
      return `<div class="day ${key===today?'today':''}">
        <header><b>${DAYS[(d.getDay()+6)%7]}</b><span>${MONS[d.getMonth()]} ${d.getDate()}</span></header>
        <div class="meals">${meals.map((m,i)=>{
          const r = S.book.find(x=>x.id===m.r);
          return `<div class="meal ${r?'':'gone'}" data-mopen="${key}:${i}">
            <button class="rm" data-mrm="${key}:${i}" title="Remove">✕</button>
            <div class="slot">${esc(m.slot||'Meal')}</div>
            <div class="ttl">${esc(r? r.title : 'Recipe not in library')}</div>
            <div class="sv">${m.s} ${esc(r? r.servingsLabel : 'servings')}</div>
          </div>`;
        }).join('')}</div>
        ${week[di].any ? macroLine(week[di]) : ''}
        <button class="addm" data-madd="${key}">＋ Plan a meal</button>
      </div>`;
    }).join('')}</div>`;
  updateStatus();
}

      <input id="pkServ" type="number" min="1" max="200" value="2">
      <button class="btn solid" data-go disabled>Add to plan</button>
    </div><div class="err"></div>`);
  let chosen = null;
  m.addEventListener('click', e=>{
    const pk = e.target.closest('[data-pick]');
    if(pk){
      chosen = pk.getAttribute('data-pick');
      $$('.pick',m).forEach(x=>x.classList.toggle('on', x===pk));
      $('[data-go]',m).disabled = false;
    }
    if(e.target.hasAttribute('data-go')){
      const sv = Math.max(1, Math.min(200, parseInt($('#pkServ',m).value,10)||1));
      (S.plan[dateKey] = S.plan[dateKey]||[]).push({r:chosen, s:sv, slot:$('#pkSlot',m).value});
      const order = {'Breakfast':0,'Lunch':1,'Dinner':2,'Prep ahead':3};
      S.plan[dateKey].sort((a,b)=>(order[a.slot]??9)-(order[b.slot]??9));
      save(); m.remove(); renderPlan();
    }
  });
}
/* convertible unit families: sum in a base unit, display via normUnit */
const FAM = {
  tsp:['usvol',1], tbsp:['usvol',3], fl_oz:['usvol',6], cup:['usvol',48],
  ml:['mlvol',1], l:['mlvol',1000],
  g:['mass',1], kg:['mass',1000], mg:['mass',0.001],
  oz:['usmass',1], lb:['usmass',16]
};
const FAM_BASE = { usvol:'tsp', mlvol:'ml', mass:'g', usmass:'oz' };
function toBase(amount, unit){
  const f = FAM[unit];
  return f ? {fam:f[0], v:amount*f[1]} : {fam:'u:'+(unit||''), v:amount};
}
function fromBase(v, fam){
  if(fam.startsWith('u:')) return [v, fam.slice(2)||null];
  return normUnit(v, FAM_BASE[fam]);
}
/* ---------------- shopping list ----------------
   A "mix" is any planned ingredient carrying a components array. Each one is
   switchable on its own between buying the packet and buying its parts, and the
   key is meal-scoped so the same paste in two meals stays independently set.
   S.mixShut holds the mixes explicitly set to "packet" — absent means broken down. */
function mixKey(dayKey, mi, ing){ return dayKey+'#'+mi+'#'+(ing.id||ing.name); }
function isMix(ing){ return !!(ing.components && ing.components.length); }

function planMeals(){
  const out=[], mon=S.week;
  for(let i=0;i<7;i++){
    const key=ymd(addDays(mon,i));
    (S.plan[key]||[]).forEach((m,mi)=>{
      const r=S.book.find(x=>x.id===m.r); if(!r) return;
      out.push({key, mi, m, r, day:i, mult:m.s/r.servings});
    });
  }
  return out;
}
function planMixes(){
  const out=[];
  planMeals().forEach(pm=>pm.r.ingredients.forEach(ing=>{
    if(isMix(ing) && ing.shop!==false) out.push({k:mixKey(pm.key,pm.mi,ing), name:ing.name, meal:pm});
  }));
  return out;
}

function newBucket(){ return {agg:new Map(), loose:new Map()}; }
function putLoose(bk, name, src){
  const k = name.toLowerCase();
  const e = bk.loose.get(k) || {name, from:new Map()};
  const fk = src.recipe+'|'+(src.mix||'');
  if(!e.from.has(fk)) e.from.set(fk, src);
  bk.loose.set(k, e);
}
function putInto(bk, ing, amount, unit, src){
  const b = toBase(amount, unit);
  const k = ing.name.toLowerCase()+'|'+b.fam;
  const e = bk.agg.get(k) || {ing, key:k, fam:b.fam, total:0, from:new Map()};
  e.total += b.v;
  const fk = src.recipe+'|'+(src.mix||'');
  if(!e.from.has(fk)) e.from.set(fk, src);
  bk.agg.set(k, e);
}
function bucketRows(bk){
  return Array.from(bk.agg.values()).sort((a,b)=>a.ing.name.localeCompare(b.ing.name));
}
function bucketLoose(bk){
  return Array.from(bk.loose.values()).sort((a,b)=>a.name.localeCompare(b.name));
}

function buildShop(){
  const all = newBucket(), groups = new Map();
  planMeals().forEach(pm=>{
    const r = pm.r, mult = pm.mult;
    let g = groups.get(r.id);
    if(!g){ g = {id:r.id, title:r.title, meals:0, servings:0,
                 label:r.servingsLabel||'servings', bk:newBucket()}; groups.set(r.id, g); }
    g.meals++; g.servings += pm.m.s;
    const f = ing => ing.scale===false ? 1 : mult;
    r.ingredients.forEach(ing=>{
      /* shop:false — reserved pasta water, water for boiling, anything already
         in the kitchen by definition. Still cooked with, never shopped for. */
      if(ing.shop===false) return;
      const open = isMix(ing) && !S.mixShut.has(mixKey(pm.key, pm.mi, ing));
      if(open){
        const src = {recipe:r.title, mix:ing.name};
        ing.components.forEach(c=>{
          if(c.shop===false) return;
          if(c.amount==null){ putLoose(all, c.name, src); putLoose(g.bk, c.name, src); return; }
          const cc = {name:c.name, namePlural:c.namePlural||''};
          putInto(all,  cc, c.amount*f(ing), c.unit, src);
          putInto(g.bk, cc, c.amount*f(ing), c.unit, src);
        });
        return;
      }
      const src = {recipe:r.title, mix:null, packet:isMix(ing)};
      if(ing.amount==null){ putLoose(all, ing.name, src); putLoose(g.bk, ing.name, src); return; }
      putInto(all,  ing, ing.amount*f(ing), ing.unit, src);
      putInto(g.bk, ing, ing.amount*f(ing), ing.unit, src);
    });
  });
  return {
    rows: bucketRows(all), loose: bucketLoose(all),
    groups: Array.from(groups.values()).map(g=>({...g, rows:bucketRows(g.bk), loose:bucketLoose(g.bk)}))
  };
}

function shopModal(){
  const mon = S.week;
  let grouped = false;
  const mixes = planMixes();
  let data = buildShop();
  if(!data.rows.length && !data.loose.length){ say('nothing planned this week'); return; }

  const disp = e=>{
    const [v,u] = fromBase(e.total, e.fam);
    return { q: qtyOf({amount:v, unit:u, scale:true}, 1),
             nm: (e.ing.namePlural && v>1) ? e.ing.namePlural : e.ing.name };
  };
  /* provenance line under an ingredient: which recipe wanted it, and whether it
     arrived as part of a mix rather than as a thing the recipe names outright */
  const srcText = (e, hideRecipe)=> Array.from(e.from.values()).map(s=>{
    if(s.mix) return (hideRecipe? '' : s.recipe+' ') + '→ '+s.mix;
    return hideRecipe ? (s.packet? 'bought pre-made' : '·') : s.recipe;
  }).filter(t=>t!=='·').join(', ');
  const badges = e=>{
    const v = Array.from(e.from.values());
    let out='';
    if(v.some(s=>s.mix))    out += '<span class="tag mix">mix</span>';
    if(v.some(s=>s.packet)) out += '<span class="tag pkt">packet</span>';
    return out;
  };
  const li = (e, scope)=>{
    const d = disp(e), s = srcText(e, !!scope);
    return `<li data-shop="${esc((scope||'')+e.key)}">
      <span class="box"></span><span class="qty">${esc(d.q)}</span>
      <span class="nm">${esc(d.nm)}${badges(e)}${s?`<small>${esc(s)}</small>`:''}</span></li>`;
  };
  const looseSrc = (l, hideRecipe)=> Array.from(l.from.values())
    .map(s=> s.mix ? (hideRecipe?'':s.recipe+' ')+'→ '+s.mix : (hideRecipe?'':s.recipe))
    .filter(Boolean).join(', ');
  const looseLi = (l, scope)=>{
    const s = looseSrc(l, !!scope);
    return `<li><span class="box" style="visibility:hidden"></span><span class="qty">—</span>
      <span class="nm">${esc(l.name)}<small>to taste${s?' · '+esc(s):''}</small></span></li>`;
  };

  const mixPanel = ()=> !mixes.length ? '' : `<div class="mixpanel"><h4>Pre-made mixes — buy the parts, or buy the packet</h4>
    ${mixes.map(mx=>`<div class="mixrow">
      <button class="swi" data-mixk="${esc(mx.k)}">
        <span class="${S.mixShut.has(mx.k)?'':'on'}">Parts</span><span class="${S.mixShut.has(mx.k)?'on':''}">Packet</span>
      </button>
      <b>${esc(mx.name)}</b><small>${esc(mx.meal.r.title)} · ${DAYS[mx.meal.day]}</small></div>`).join('')}</div>`;

  const listHTML = ()=>{
    if(!grouped) return `<ul class="shoplist bom">${data.rows.map(e=>li(e)).join('')}${data.loose.map(l=>looseLi(l)).join('')}</ul>`;
    return data.groups.map(g=>`<div class="shopgrp">
      <h4>${esc(g.title)}<span>${g.servings} ${esc(g.label)}${g.meals>1?' · '+g.meals+' meals':''}</span></h4>
      <ul class="shoplist bom">${g.rows.map(e=>li(e,'g'+g.id+':')).join('')}${g.loose.map(l=>looseLi(l,1)).join('')}</ul>
    </div>`).join('');
  };

  const copyText = ()=>{
    const head = 'Shopping — week of '+weekLabel(mon);
    if(!grouped){
      const body = data.rows.map(e=>{
        const d = disp(e), s = srcText(e);
        return '[ ] '+(d.q? d.q+' ':'')+d.nm+(s? '  ('+s+')' : '');
      }).concat(data.loose.map(l=>{ const s=looseSrc(l); return '[ ] '+l.name+'  (to taste'+(s?' · '+s:'')+')'; }));
      return head+'\n\n'+body.join('\n');
    }
    const secs = data.groups.map(g=>{
      const lines = g.rows.map(e=>{
        const d = disp(e), v = Array.from(e.from.values());
        const mx = v.filter(s=>s.mix).map(s=>'→ '+s.mix);
        const tag = mx.length ? '  ('+mx.join(', ')+')' : v.some(s=>s.packet) ? '  (pre-made)' : '';
        return '[ ] '+(d.q? d.q+' ':'')+d.nm+tag;
      }).concat(g.loose.map(l=>{ const s=looseSrc(l,1); return '[ ] '+l.name+'  (to taste'+(s?' · '+s:'')+')'; }));
      return g.title.toUpperCase()+' — '+g.servings+' '+g.label+(g.meals>1?' · '+g.meals+' meals':'')+'\n'+lines.join('\n');
    });
    return head+'\nGrouped by recipe\n\n'+secs.join('\n\n');
  };

  const m = modal('Shopping list — week of '+weekLabel(mon), `
    <div class="shoptop">
      <button class="swi" data-view><span class="on">Combined</span><span>By recipe</span></button>
      <span class="hint" data-hint>one line per ingredient, summed across the week</span>
    </div>
    ${mixPanel()}
    <div id="shopBody">${listHTML()}</div>
    <div class="btnrow" style="justify-content:flex-start">
      <button class="btn solid" data-copyshop>Copy as text</button></div>`);

  const redraw = ()=>{ data = buildShop(); $('#shopBody',m).innerHTML = listHTML(); };

  m.addEventListener('click', e=>{
    const mixBtn = e.target.closest('[data-mixk]');
    if(mixBtn){
      const k = mixBtn.getAttribute('data-mixk');
      if(S.mixShut.has(k)) S.mixShut.delete(k); else S.mixShut.add(k);
      const sp = mixBtn.querySelectorAll('span');
      sp[0].classList.toggle('on', !S.mixShut.has(k));
      sp[1].classList.toggle('on',  S.mixShut.has(k));
      redraw(); return;
    }
    const viewBtn = e.target.closest('[data-view]');
    if(viewBtn){
      grouped = !grouped;
      const sp = viewBtn.querySelectorAll('span');
      sp[0].classList.toggle('on', !grouped); sp[1].classList.toggle('on', grouped);
      $('[data-hint]',m).textContent = grouped
        ? 'one section per recipe — nothing is summed across recipes'
        : 'one line per ingredient, summed across the week';
      redraw(); return;
    }
    const row = e.target.closest('[data-shop]');
    if(row){ row.classList.toggle('got'); return; }
    if(e.target.hasAttribute('data-copyshop')){
      navigator.clipboard.writeText(copyText())
        .then(()=>say(grouped?'list copied — grouped by recipe':'shopping list copied'),()=>say('clipboard blocked'));
    }
  });
}

/* ---------------- global events ---------------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act],[data-open],[data-del],[data-ing],[data-serv],[data-step],[data-t],[data-jump],[data-madd],[data-mrm],[data-mopen],[data-comp]');
  if(!t) return;

  if(t.hasAttribute('data-del')){ e.stopPropagation();
    S.book = S.book.filter(r=>r.id!==t.getAttribute('data-del')); save(); renderLib(); updateStatus(); say('removed'); return; }
  if(t.hasAttribute('data-open')){ openRecipe(t.getAttribute('data-open')); return; }
  if(t.hasAttribute('data-madd')){ pickerModal(t.getAttribute('data-madd')); return; }
  if(t.hasAttribute('data-mrm')){ e.stopPropagation();
    const [k,i] = t.getAttribute('data-mrm').split(':');
    S.plan[k].splice(parseInt(i,10),1); if(!S.plan[k].length) delete S.plan[k];
    save(); renderPlan(); return; }
  if(t.hasAttribute('data-mopen')){
    const [k,i] = t.getAttribute('data-mopen').split(':');
    const m = (S.plan[k]||[])[parseInt(i,10)]; if(!m) return;
    const r = S.book.find(x=>x.id===m.r); if(!r){ say('that recipe is no longer in the library'); return; }
    openRecipe(r.id); S.servings = m.s; renderRec(); return; }
  if(t.hasAttribute('data-comp')){ e.stopPropagation();
    const id=t.getAttribute('data-comp'); S.comp.has(id)?S.comp.delete(id):S.comp.add(id); renderRec(); return; }
  if(t.hasAttribute('data-ing')){
    const id=t.getAttribute('data-ing'); S.got.has(id)?S.got.delete(id):S.got.add(id); t.classList.toggle('got'); return; }
  if(t.hasAttribute('data-serv')){
    const d=parseInt(t.getAttribute('data-serv'),10);
    S.servings = Math.max(1, Math.min(200, S.servings + d)); renderRec(); return; }
  if(t.hasAttribute('data-step')){ startCook(parseInt(t.getAttribute('data-step'),10)); return; }
  if(t.hasAttribute('data-jump')){ S.idx=parseInt(t.getAttribute('data-jump'),10); renderCook(); return; }
  if(t.closest('.timer')){
    const box=t.closest('.timer'); const act=e.target.getAttribute('data-tact'); if(!act) return;
    const tm=S.timers.find(x=>x.id===box.getAttribute('data-t')); if(!tm) return;
    if(act==='rename'){ startRename(box, tm); return; }
    if(act==='toggle'){ if(tm.left<=0){ tm.left=tm.total; tm.since=0; } tm.running=!tm.running; }
    if(act==='add'){ tm.left+=60; tm.running=true; tm.since=0; }
    if(act==='kill'){ S.timers=S.timers.filter(x=>x.id!==tm.id); }
    drawTimers(); return; }

  switch(t.getAttribute('data-act')){
    case 'pick': $('#fileIn').click(); break;
    case 'paste': pasteModal(); break;
    case 'export': exportBook(); break;
    case 'demo': addRecipes(ingestJSON(DEMO,'demo')); break;
    case 'cook': startCook(S.cur.at || 0); break;
    case 'restart': S.cur.at = null; startCook(0); break;
    case 'wkprev': S.week = addDays(S.week,-7); renderPlan(); break;
    case 'wknext': S.week = addDays(S.week, 7); renderPlan(); break;
    case 'wktoday': S.week = weekStart(new Date()); renderPlan(); break;
    case 'shop': shopModal(); break;
    case 'theme': toggleTheme(); break;
    case 'print': window.print(); break;
    case 'quit': quitCook(); break;
    case 'prev': goStep(-1); break;
    case 'next': goStep(1); break;
    case 'fire': { const s=S.cur.steps[S.idx]; addTimer(s.title||('Step '+(S.idx+1)), s.timer); break; }
    case 'tnew': S.newTimer = !S.newTimer; drawTimers(); break;
    case 'tcancel': S.newTimer = false; drawTimers(); break;
    case 'tstart': addTimer($('#tnName').value || 'Timer', parseDur($('#tnDur').value)); break;
  }
});
document.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.hasAttribute && e.target.hasAttribute('data-open')){
    e.preventDefault(); openRecipe(e.target.getAttribute('data-open'));
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && (e.target.id==='tnName' || e.target.id==='tnDur')){
    e.preventDefault(); addTimer($('#tnName').value || 'Timer', parseDur($('#tnDur').value));
  }
});

$('#btnPlan').addEventListener('click', openPlan);
$('#btnAdd').addEventListener('click', ()=>$('#fileIn').click());
$('#btnFmt').addEventListener('click', fmtModal);
$('#btnBack').addEventListener('click', ()=>{ if(S.view==='cook') quitCook(); else { show('lib'); renderLib(); } });
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea,select')) return;
  if((e.key==='p'||e.key==='P') && S.view!=='cook'){ openPlan(); e.preventDefault(); }
});
$('#btnWake').addEventListener('click', ()=> requestWake(!$('#btnWake').classList.contains('on')));
function toggleTheme(){
  const night = document.documentElement.getAttribute('data-theme')==='night';
  document.documentElement.setAttribute('data-theme', night?'day':'night');
  const lbl = night?'Night':'Day';
  $('#btnTheme').textContent = lbl;
  const c = $('#btnThemeCook'); if(c) c.textContent = lbl;
  save();
}
$('#btnTheme').addEventListener('click', toggleTheme);
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea')) return;
  if(e.key==='t' || e.key==='T'){ S.newTimer = true; drawTimers(); e.preventDefault(); return; }
  if(S.view==='cook'){
    if(e.key==='ArrowRight'){ goStep(1); e.preventDefault(); }
    if(e.key==='ArrowLeft'){ goStep(-1); e.preventDefault(); }
    if(e.key===' '){ const s=S.cur.steps[S.idx]; if(s.timer) addTimer(s.title||('Step '+(S.idx+1)), s.timer); e.preventDefault(); }
    if(e.key==='Escape') quitCook();
  } else if(S.view==='rec'){
    if(e.key==='Escape'){ show('lib'); renderLib(); }
  }
});
