<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choicer Party — package tester</title>
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314110f'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%235ec27a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../css/party.css?v=5">
<style>
.tester{flex:1;padding:1.25rem 1rem 3rem;display:grid;gap:1.25rem;grid-template-columns:minmax(0,1fr) minmax(0,1fr);max-width:1400px;margin:0 auto;width:100%}
.tester section{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem;min-width:0}
.tester h2{margin:0 0 .6rem;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.tester h2 .mono{color:var(--ink2)}
.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.25rem;font-size:.88rem}
.results li{display:grid;grid-template-columns:1.4rem minmax(0,1fr);gap:.5rem;padding:.35rem .5rem;border-radius:6px;background:var(--bg2);border:1px solid var(--line)}
.results li.pass{border-color:#2f5a3a}
.results li.fail{border-color:#7a2a24;background:#241614}
.results li.skip{opacity:.6}
.results .mark{font-weight:700}
.results li.pass .mark{color:var(--green)}
.results li.fail .mark{color:#ff8a82}
.results .detail{display:block;color:var(--ink3);font-family:var(--mono);font-size:.78rem;white-space:pre-wrap;margin-top:.2rem}
.pickers{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
.pickers input[type=url]{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;color:var(--ink);padding:.45rem .6rem;font:inherit;font-family:var(--mono);font-size:.85rem}
.report{font-size:.86rem}
.report dl{display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;margin:.4rem 0 .8rem}
.report dt{color:var(--ink3)}
.report dd{margin:0}
.report table{width:100%;border-collapse:collapse;font-size:.82rem}
.report th{text-align:left;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);padding:.3rem .4rem;border-bottom:1px solid var(--line)}
.report td{padding:.3rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
.report td.cap{color:var(--ink2);max-width:28ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.report tr.warn td{background:#26201a}
.report .w{color:var(--amber);font-size:.78rem}
.report .ok{color:var(--green)}
.report .bad{color:#ff8a82}
.summary{display:flex;gap:1rem;flex-wrap:wrap;font-size:.85rem;color:var(--ink2);margin:.5rem 0}
.summary b{color:var(--ink)}
.drop.small-drop{padding:1.2rem 1rem;width:auto}
.drop.small-drop h1{font-size:1.05rem}
@media (max-width:960px){.tester{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><span class="brand-dot" aria-hidden="true" style="background:#2f5a3a"></span>Choicer&nbsp;<b>Party</b><span class="brand-sub">package tester</span></div>
  <div class="bar-right"><a class="ghost" href="../" style="padding:.5rem .9rem;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:inherit">Back to the booth</a></div>
</header>

<main class="tester">
  <section>
    <h2>Unit tests <span class="mono" id="unitSummary">running…</span></h2>
    <ul class="results" id="unitResults"></ul>
  </section>

  <section>
    <h2>Package check <span class="mono" id="packSummary"></span></h2>
    <div class="drop small-drop" id="drop" tabindex="0">
      <div class="drop-inner">
        <h1>Drop a package folder or .zip</h1>
        <div class="pickers">
          <button class="primary" id="btnPickFolder">Choose folder…</button>
          <button id="btnPickZip">Choose .zip…</button>
        </div>
        <form class="pickers" id="urlForm">
          <input type="url" id="urlInput" placeholder="https://… /package-folder/ (needs index.json or dub_markers.json)">
          <button type="submit">Check URL</button>
        </form>
        <p class="drop-error" id="packError" hidden></p>
      </div>
      <input type="file" id="fileFolder" webkitdirectory directory multiple hidden>
      <input type="file" id="fileZip" accept=".zip,application/zip" hidden>
    </div>
    <div class="report" id="report"></div>
  </section>
</main>

<footer class="status">
  <span id="status">Loads the same modules the booth uses; nothing here touches a saved session.</span>
  <span class="mono dim">choicer-party test r1</span>
</footer>

<script type="module" src="./tests.js?v=2"></script>
</body>
</html>
